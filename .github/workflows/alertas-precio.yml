name: Alertas de precio

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar precios y avisar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node .github/scripts/check-alertas.js
      - name: Guardar estado de alertas ya avisadas
        run: |
          git config user.name "alertas-bot"
          git config user.email "actions@github.com"
          git add estado.json
          git diff --cached --quiet || git commit -m "Actualiza estado de alertas [skip ci]"
          git push
